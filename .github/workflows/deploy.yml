name: Deploy CloudNav to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create KV namespace (if missing)
        id: create-kv
        run: |
          set -e
          # 查找已存在的 CLOUDNAV_KV namespace
          LIST_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          EXISTING_ID=$(echo "$LIST_JSON" | python3 -c "
import json,sys
d=json.load(sys.stdin)
for ns in d.get('result',[]):
    if ns.get('title')=='cloudnav-kv':
        print(ns['id']); break
")
          if [ -n "$EXISTING_ID" ]; then
            echo "kv_namespace_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
          else
            CREATE_JSON=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"title":"cloudnav-kv"}')
            NEW_ID=$(echo "$CREATE_JSON" | python3 -c "
import json,sys
d=json.load(sys.stdin)
print(d.get('result',{}).get('id') or '')
")
            if [ -z "$NEW_ID" ]; then
              echo "KV namespace create failed: $CREATE_JSON"
              exit 1
            fi
            echo "kv_namespace_id=$NEW_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create cloudnav --production-branch=main || true
          npx wrangler pages deploy dist --project-name=cloudnav --branch=main --commit-dirty=true

      - name: Bind KV namespace + set PASSWORD via API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_ID="${{ steps.create-kv.outputs.kv_namespace_id }}"
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cloudnav" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{
              \"deployment_configs\": {
                \"production\": {
                  \"kv_namespaces\": {
                    \"CLOUDNAV_KV\": { \"namespace_id\": \"$KV_ID\" }
                  },
                  \"env_vars\": {
                    \"PASSWORD\": { \"type\": \"secret_text\", \"value\": \"${{ secrets.CLOUDNAV_PASSWORD }}\" }
                  }
                }
              }
            }" -o /tmp/patch-result.json -w "HTTP %{http_code}\n"
          cat /tmp/patch-result.json

      - name: Trigger re-deploy to apply bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 绑定改动需要一次新的 deployment 才会生效
          npx wrangler pages deploy dist --project-name=cloudnav --branch=main --commit-dirty=true